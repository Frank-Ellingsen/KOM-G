version: '3.8'

services:
  streamlit-app:
    build: .
    container_name: kostra_streamlit_app
    ports:
      - "8501:8501"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SPIDER_API_KEY=${SPIDER_API_KEY}
      - SERPER_API_KEY=${SERPER_API_KEY}
      - DUCKDB_PATH=/app/data/database/kostra.duckdb
      - MLFLOW_TRACKING_URI=http://mlflow-server:5000
    volumes:
      - .:/app
      - chroma_data:/app/chroma_db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mlflow-server
    restart: unless-stopped

  mlflow-server:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: kostra_mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - ./data/database:/app/data/database
      - ./mlruns:/app/mlruns
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////app/data/database/mlflow.db
      --default-artifact-root /app/mlruns
    restart: unless-stopped

volumes:
  chroma_data:
